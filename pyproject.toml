[project]
name = "amocrm-1c-resilient-gateway"
version = "1.0.0"
description = "Resilient AmoCRM -> 1C integration gateway (HMAC, SQLite WAL, circuit breaker, n8n DLQ)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gateway", "gateway.contracts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Baseline enforced in CI: pyflakes, pycodestyle, isort, bugbear, pyupgrade,
# flake8-simplify, comprehensions and refactor rules.
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4", "RET"]

[tool.ruff.lint.per-file-ignores]
# Test doubles intentionally expose broad *args/**kwargs signatures.
"tests/*" = ["ARG"]
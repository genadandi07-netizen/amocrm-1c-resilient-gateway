services:
  gateway:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # SQLite (WAL) shared with egress-worker; default path inside the image
      # is /app/data/gateway.db (Dockerfile ENV GATEWAY_DB_PATH).
      - ./data:/app/data

  # Background delivery worker: consumes VALIDATED/FAILED events from the same
  # SQLite database and pushes them into 1C OData (scripts/egress_worker.py).
  egress-worker:
    build: .
    command: ["python", "-m", "scripts.egress_worker"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    depends_on:
      - gateway
    # The image healthcheck probes the HTTP gateway; the worker exposes no
    # port, so probe the shared SQLite instead.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sqlite3;
          c = sqlite3.connect(os.environ['GATEWAY_DB_PATH']);
          c.execute('SELECT 1'); c.close()
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    # Let the current delivery pass (incl. 1C backoff) finish on SIGTERM.
    stop_grace_period: 45s
